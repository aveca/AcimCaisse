<!DOCTYPE html>
<html>
<head>
  <base href="/AcimCaisse/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AcimCaisse - caisse hors-ligne pour epicerie">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AcimCaisse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AcimCaisse</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="acimcaisse-ux-fix.css">
  <script src="fix-negative-stock.js"></script>
  <script src="barcode-autocomplete.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=30" async></script>

  <!-- Download button — desktop only, hidden on mobile -->
  <script>
    (function() {
      var isDesktop = window.innerWidth > 768 && !('ontouchstart' in window);
      if (!isDesktop) return;
      var a = document.createElement('a');
      a.id = 'acim-download-btn';
      a.href = 'https://github.com/aveca/AcimCaisse/releases';
      a.target = '_blank';
      a.textContent = '\uD83D\uDCE5 App Windows';
      a.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:999998;padding:10px 18px;background:#e65100;color:#fff;text-decoration:none;border-radius:10px;font:bold 13px/1 Segoe UI,Arial,sans-serif;box-shadow:0 3px 12px rgba(230,81,0,0.35);transition:background .2s,transform .2s;';
      a.onmouseenter = function() { this.style.background = '#c43e00'; this.style.transform = 'translateY(-1px)'; };
      a.onmouseleave = function() { this.style.background = '#e65100'; this.style.transform = 'none'; };
      document.body.appendChild(a);
    })();
  </script>

  <!-- Stock fix — runs once, deferred -->
  <script>
    setTimeout(function() {
      if (window.AcimCaisseStockFix) window.AcimCaisseStockFix.fix();
    }, 4000);
  </script>
</body>
</html>
