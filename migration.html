<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcimCaisse — Migration des données</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:20px;}
  .container{max-width:700px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:4px;}
  .subtitle{font-size:13px;color:#666;margin-bottom:20px;}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .card h2{font-size:16px;margin-bottom:8px;}
  .card p{font-size:13px;color:#666;margin-bottom:8px;}
  .btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
  .btn-primary{background:#e65100;color:#fff;}.btn-primary:hover{background:#c43e00;}
  .btn-success{background:#2e7d32;color:#fff;}.btn-success:hover{background:#1b5e20;}
  .btn-info{background:#1565c0;color:#fff;}.btn-info:hover{background:#0d47a1;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .status{padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0;min-height:20px;word-wrap:break-word;}
  .status-ok{background:#e8f5e9;color:#2e7d32;}
  .status-err{background:#ffebee;color:#c62828;}
  .status-info{background:#e3f2fd;color:#1565c0;}
  .status-warn{background:#fff3e0;color:#e65100;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
  th,td{padding:6px 8px;border-bottom:1px solid #f0f0f0;text-align:left;}
  th{background:#f5f5f5;font-weight:700;}
  pre{background:#1a1a2e;color:#a5d6a7;padding:10px;border-radius:8px;font-size:11px;overflow-x:auto;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;font-family:'Courier New',monospace;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="container">
  <h1>🔄 Migration des données AcimCaisse</h1>
  <p class="subtitle">Récupérez vos produits, ventes et paramètres de l'ancienne version Flutter.</p>

  <div class="card" id="step1">
    <h2>1. Scanner et migrer</h2>
    <p>Cliquez pour scanner toutes les bases IndexedDB, reconstruire SQLite, et migrer vos produits.</p>
    <div id="s1-status" class="status status-info">En attente...</div>
    <button class="btn btn-primary" id="btn1" onclick="startMigration()">🔍 Scanner et migrer automatiquement</button>
  </div>

  <div class="card hidden" id="step2">
    <h2>2. Log détaillé</h2>
    <div id="s2-log"></div>
  </div>

  <div class="card hidden" id="step3">
    <h2>3. Résultat</h2>
    <div id="s3-content"></div>
  </div>
</div>

<script>
"use strict";
var _old={products:[],categories:[],sales:[],saleItems:[],payments:[],settings:null};
var _log=[];
var _logEl;

function log(msg,cls){
  _log.push({msg:msg,cls:cls||""});
  if(!_logEl)_logEl=document.getElementById("s2-log");
  if(!_logEl)return;
  _logEl.innerHTML="<pre>"+_log.map(function(l){return'<span style="color:'+(l.cls==="err"?"#ef5350":l.cls==="ok"?"#66bb6a":"#90caf9")+'">'+esc(l.msg)+"</span>";}).join("\n")+"</pre>";
  _logEl.scrollTop=_logEl.scrollHeight;
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function setInfo(msg){document.getElementById("s1-status").textContent=msg;}
function setWarn(msg){var e=document.getElementById("s1-status");e.textContent=msg;e.className="status status-warn";}
function setOk(msg){var e=document.getElementById("s1-status");e.textContent=msg;e.className="status status-ok";}
function setErr(msg){var e=document.getElementById("s1-status");e.textContent=msg;e.className="status status-err";}

// ═══════════════════════════════════════════════════════════
//  MAIN ENTRY
// ═══════════════════════════════════════════════════════════
function startMigration(){
  document.getElementById("btn1").disabled=true;
  document.getElementById("step2").classList.remove("hidden");
  setInfo("🔍 Scan de toutes les bases IndexedDB...");

  if(!indexedDB.databases){
    setErr("❌ indexedDB.databases() non supporté.");
    document.getElementById("btn1").disabled=false;
    return;
  }

  indexedDB.databases().then(function(dbs){
    if(!dbs||dbs.length===0){
      setErr("❌ Aucune base IndexedDB trouvée.");
      return;
    }
    log("✅ "+dbs.length+" base(s) trouvée(s): "+dbs.map(function(d){return d.name;}).join(", "),"ok");
    // Find acim_caisse
    var target=null;
    for(var i=0;i<dbs.length;i++){
      if(dbs[i].name==="acim_caisse"){target=dbs[i];break;}
    }
    if(!target){
      setErr("❌ Base 'acim_caisse' non trouvée.");
      log("Bases disponibles: "+dbs.map(function(d){return d.name+" v"+d.version;}).join(", "),"err");
      return;
    }
    log("✅ acim_caisse trouvée (v"+target.version+")","ok");
    openAndExtract(target);
  }).catch(function(err){
    setErr("❌ Erreur scan: "+err.message);
  });
}

// ═══════════════════════════════════════════════════════════
//  OPEN acim_caisse AND READ ALL STORES
// ═══════════════════════════════════════════════════════════
function openAndExtract(dbInfo){
  var req=indexedDB.open(dbInfo.name,dbInfo.version);
  req.onerror=function(e){setErr("❌ Erreur ouverture: "+(e.target.error?.message||"unknown"));};
  req.onsuccess=function(e){
    var db=e.target.result;
    var stores=Array.from(db.objectStoreNames);
    log("Stores: "+stores.join(", "),"ok");

    if(stores.length===0){
      setErr("❌ Aucun store.");
      return;
    }

    var allData={};
    var pending=stores.length;
    stores.forEach(function(sname){
      try{
        var tx=db.transaction(sname,"readonly");
        var store=tx.objectStore(sname);
        // Use cursor to get BOTH key and value (needed for Drift blocks compound keys)
        var entries=[];
        var cursorReq=store.openCursor();
        cursorReq.onsuccess=function(ce){
          var cursor=ce.target.result;
          if(cursor){
            entries.push({key:cursor.key,value:cursor.value});
            cursor.continue();
          } else {
            allData[sname]=entries;
            log("📦 '"+sname+"': "+entries.length+" entrées");
            pending--;
            if(pending===0) processData(allData);
          }
        };
        cursorReq.onerror=function(){
          // Fallback to getAll
          store.getAll().onsuccess=function(de){
            allData[sname]=(de.target.result||[]).map(function(v,i){return{key:i,value:v};});
            log("📦 '"+sname+"': "+allData[sname].length+" entrées (fallback)");
            pending--;
            if(pending===0) processData(allData);
          };
          cursorReq.onerror=function(){
            pending--;
            if(pending===0) processData(allData);
          };
        };
      }catch(err){
        log("❌ Store '"+sname+"': "+err.message,"err");
        pending--;
        if(pending===0) processData(allData);
      }
    });
  };
}

// ═══════════════════════════════════════════════════════════
//  PROCESS: DETECT DRIFT OR DIRECT
// ═══════════════════════════════════════════════════════════
function processData(allData){
  if(allData.files&&allData.blocks){
    log("","info");
    log("═══ Structure Drift (files + blocks) détectée ═══","info");
    log("files: "+allData.files.length+" | blocks: "+allData.blocks.length,"info");
    // Show file info
    allData.files.forEach(function(f,i){
      log("  file["+i+"]: name='"+f.name+"' length="+f.length+" version="+f.version);
    });
    // Try to reconstruct SQLite
    reconstructDrift(allData.files,allData.blocks);
  } else {
    // Check for blocks-only
    var hasBlocks=false;
    var storeNames=Object.keys(allData);
    for(var i=0;i<storeNames.length;i++){
      if(storeNames[i].toLowerCase().indexOf("block")>=0){hasBlocks=true;break;}
    }
    if(hasBlocks){
      log("Store 'blocks' trouvé mais pas de 'files' — tentative de reconstruction...","info");
      var blocks=[];
      storeNames.forEach(function(sn){
        if(sn.toLowerCase().indexOf("block")>=0) blocks=allData[sn];
      });
      reconstructDrift([],blocks);
    } else {
      log("Données directes (pas Drift)","info");
      directExtract(allData);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  RECONSTRUCT SQLITE FROM DRIFT BLOCKS
// ═══════════════════════════════════════════════════════════
function reconstructDrift(files,blocks){
  log("","info");
  log("═══ Reconstruction SQLite ═══","info");

  // Find the main file (largest)
  var mainFile=null;
  if(files.length>0){
    for(var i=0;i<files.length;i++){
      if(!mainFile||files[i].length>mainFile.length) mainFile=files[i];
    }
    log("Fichier principal: name='"+mainFile.name+"' length="+mainFile.length);
  }

  // DEBUG: show actual key/value types of first 10 blocks
  log("","info");
  log("═══ DEBUG: structure des blocks ═══","info");
  for(var di=0;di<Math.min(10,blocks.length);di++){
    var b=blocks[di];
    var keyType=typeof b.key;
    var keyStr="";
    if(b.key===undefined)keyStr="undefined";
    else if(b.key===null)keyStr="null";
    else if(Array.isArray(b.key))keyStr="Array["+b.key.length+"]=["+b.key.join(", ")+"]";
    else if(typeof b.key==="object")keyStr="Object{"+Object.keys(b.key).join(",")+"}";
    else if(typeof b.key==="string")keyStr="String('"+b.key.substring(0,80)+"')";
    else if(typeof b.key==="number")keyStr="Number("+b.key+")";
    else keyStr=keyType;
    var valType=typeof b.value;
    var valInfo="";
    if(b.value instanceof Uint8Array)valInfo="Uint8Array["+b.value.length+"] head="+Array.from(b.value.slice(0,8)).map(function(x){return("0"+x.toString(16)).slice(-2);}).join(" ");
    else if(b.value instanceof ArrayBuffer)valInfo="ArrayBuffer["+b.value.byteLength+"]";
    else if(b.value&&b.value.buffer!=null)valInfo="TypedArray["+((b.value.length)||"?")+"]";
    else if(Array.isArray(b.value))valInfo="Array["+b.value.length+"] first="+JSON.stringify(b.value.slice(0,4));
    else if(typeof b.value==="string")valInfo="String("+b.value.length+") '"+b.value.substring(0,60)+"'";
    else if(b.value&&typeof b.value==="object")valInfo="Object{"+Object.keys(b.value).join(",")+"}";
    else valInfo=String(b.value).substring(0,60);
    log("  block["+di+"]: key="+keyStr);
    log("    val: "+valInfo);
  }

  // Strategy 1: Parse block keys as [fileId, offset] arrays
  var fileIdMap={};
  blocks.forEach(function(b,idx){
    if(!b.key&&b.key!==0)return;
    if(Array.isArray(b.key)){
      var fid=b.key[0], off=b.key[1]||0;
      if(!fileIdMap[fid])fileIdMap[fid]=[];
      fileIdMap[fid].push({offset:off,value:toBytes(b.value),idx:idx});
    }
  });

  var fids=Object.keys(fileIdMap);
  if(fids.length>0){
    log("FileIDs (array keys): "+fids.join(", "));
    // Try each fileId, look for SQLite header
    for(var fi=0;fi<fids.length;fi++){
      var fid=fids[fi];
      var rel=fileIdMap[fid];
      rel.sort(function(a,b){return a.offset-b.offset;});
      log("  fid "+fid+": "+rel.length+" blocks");

      // Check if first block has SQLite header
      if(rel.length>0&&rel[0].value&&rel[0].value.length>=16){
        var hdr=rel[0].value;
        if(hdr[0]===0x53&&hdr[1]===0x51&&hdr[2]===0x4C&&hdr[3]===0x69){
          log("  ✅ SQLite header trouvé!","ok");
          var maxEnd=0;
          rel.forEach(function(r){if(r.offset+r.value.length>maxEnd)maxEnd=r.offset+r.value.length;});
          buildAndParse({length:maxEnd},rel);
          return;
        }
      }
    }
    log("Aucun fileId n'a de header SQLite dans le 1er bloc","info");
  }

  // Strategy 2: Scan ALL blocks for SQLite header (53 51 4C 69 = "SQLi")
  log("Scan de tous les blocs pour header SQLite...","info");
  for(var bi=0;bi<blocks.length;bi++){
    var val=toBytes(blocks[bi].value);
    if(!val||val.length<16)continue;
    if(val[0]===0x53&&val[1]===0x51&&val[2]===0x4C&&val[3]===0x69){
      log("✅ SQLite header trouvé dans block["+bi+"]! ("+val.length+" octets)","ok");
      // Reconstruct: treat ALL blocks as one flat file using their keys as offsets
      var allBlocks=[];
      var maxOff=0;
      for(var bj=0;bj<blocks.length;bj++){
        var bv=toBytes(blocks[bj].value);
        if(!bv||bv.length===0)continue;
        var off=0;
        if(Array.isArray(blocks[bj].key))off=blocks[bj].key[1]||0;
        else if(typeof blocks[bj].key==="number")off=blocks[bj].key;
        else if(typeof blocks[bj].key==="object"&&blocks[bj].key!==null)off=blocks[bj].key.offset||blocks[bj].key.pos||0;
        allBlocks.push({offset:off,value:bv});
        if(off+bv.length>maxOff)maxOff=off+bv.length;
      }
      allBlocks.sort(function(a,b){return a.offset-b.offset;});
      buildAndParse({length:maxOff},allBlocks);
      return;
    }
  }

  // Strategy 3: Maybe blocks store SQLite pages sequentially (no offset in key)
  log("Tentative reconstruction séquentielle...","info");
  if(blocks.length>0){
    var seqBlocks=[];
    var totalLen=0;
    for(var si=0;si<blocks.length;si++){
      var sv=toBytes(blocks[si].value);
      if(!sv||sv.length===0)continue;
      seqBlocks.push({offset:totalLen,value:sv});
      totalLen+=sv.length;
    }
    if(totalLen>0){
      // Check first block for SQLite header
      if(seqBlocks[0].value.length>=4&&seqBlocks[0].value[0]===0x53&&seqBlocks[0].value[1]===0x51){
        log("✅ SQLite header trouvé (seq)!","ok");
        buildAndParse({length:totalLen},seqBlocks);
        return;
      }
    }
  }

  log("","err");
  log("❌ Impossible de reconstruire SQLite.","err");
  log("Les données existent mais dans un format non reconnu.","info");
  log("Essayez de ré-ouvrir l'ancienne app Flutter pour forcer la synchro IndexedDB.","info");
}

function toBytes(val){
  if(val instanceof Uint8Array)return val;
  if(val instanceof ArrayBuffer)return new Uint8Array(val);
  if(val&&val.buffer)return new Uint8Array(val.buffer);
  if(typeof val==="string"){
    var arr=new Uint8Array(val.length);
    for(var i=0;i<val.length;i++)arr[i]=val.charCodeAt(i)&0xff;
    return arr;
  }
  if(Array.isArray(val)){
    var arr2=new Uint8Array(val.length);
    for(var i2=0;i2<val.length;i2++)arr2[i2]=val[i2]&0xff;
    return arr2;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════
//  BUILD SQLITE FILE AND PARSE
// ═══════════════════════════════════════════════════════════
function buildAndParse(fileDesc,blocks){
  var totalLen=fileDesc.length;
  var buf=new Uint8Array(totalLen);
  var filled=0;

  for(var i=0;i<blocks.length;i++){
    var offset=blocks[i].offset;
    var blk=blocks[i].value;
    if(offset+blk.length>totalLen){
      // Extend buffer
      var newBuf=new Uint8Array(offset+blk.length);
      newBuf.set(buf);
      buf=newBuf;
      totalLen=buf.length;
    }
    for(var j=0;j<blk.length;j++){
      buf[offset+j]=blk[j];
    }
    filled+=blk.length;
  }

  log("Fichier reconstruit: "+filled+"/"+totalLen+" octets","ok");

  // Check header
  var hdr="";
  for(var k=0;k<Math.min(16,buf.length);k++) hdr+=String.fromCharCode(buf[k]);
  log("Header: "+JSON.stringify(hdr));

  if(buf[0]===0x53&&buf[1]===0x51&&buf[2]===0x4C&&buf[3]===0x69){
    log("✅ Fichier SQLite valide!","ok");
    parseSQLite(buf);
  } else {
    log("❌ Header invalide","err");
  }
}

// ═══════════════════════════════════════════════════════════
//  SQLITE PARSER (pure JS, no dependencies)
// ═══════════════════════════════════════════════════════════
function parseSQLite(data){
  log("","info");
  log("═══ Parsing SQLite ═══","info");

  // Show raw header bytes
  var hdrHex="";
  for(var hx=0;hx<Math.min(32,data.length);hx++){
    hdrHex+=("0"+data[hx].toString(16)).slice(-2)+" ";
    if(hx%16===15)hdrHex+="\n    ";
  }
  log("Header hex: "+hdrHex);

  var pageSz=(data[16]<<8)|data[17];
  log("Raw page size bytes: ["+data[16]+", "+data[17]+"] = "+pageSz);
  if(pageSz===1)pageSz=65536;
  if(pageSz===0)pageSz=4096;
  log("Page size: "+pageSz+" bytes");

  // Show page 1 type byte
  log("Page 1 type byte (offset 0): "+data[0]+" (0x"+data[0].toString(16)+")");
  log("Page 1 type description: "+(data[0]===13?"leaf table b-tree (13)":data[0]===5?"interior b-tree (5)":data[0]===10?"leaf index (10)":data[0]===2?"interior index (2)":"UNKNOWN ("+data[0]+")"));

  try{
    var masterRows=readTable(data,pageSz,1);
    log("sqlite_master: "+masterRows.length+" lignes","ok");

    // Convert master rows to objects
    var masterFields=["type","name","tbl_name","rootpage","sql"];
    var masterObjs=masterRows.map(function(r){return arrayToObj(r,masterFields);});

    var tables={};
    for(var i=0;i<masterObjs.length;i++){
      var r=masterObjs[i];
      if(r.type==="table"&&r.name!=="sqlite_sequence"&&r.name!=="_meta"){
        tables[r.name]={rootpage:r.rootpage,sql:r.sql};
        log("  table: '"+r.name+"' rootpage="+r.rootpage);
      }
    }

    var names=Object.keys(tables);
    log("Tables: "+names.join(", "),"ok");

    for(var ti=0;ti<names.length;ti++){
      var tn=names[ti];
      try{
        var rows=readTable(data,pageSz,tables[tn].rootpage);
        log("  "+tn+": "+rows.length+" lignes","ok");
        // Show first 2 rows
        for(var ri=0;ri<Math.min(2,rows.length);ri++){
          log("    ["+ri+"]: "+JSON.stringify(rows[ri]).substring(0,200));
        }
        mapTableToOld(tn,rows);
      }catch(e){
        log("  ❌ Erreur "+tn+": "+e.message,"err");
      }
    }
    showExtractedAndMigrate();
  }catch(e){
    log("❌ Erreur parsing: "+e.message,"err");
    console.error(e);
  }
}

function mapTableToOld(tableName,rows){
  var fieldMap={
    "products":["id","createdAt","updatedAt","deletedAt","isDirty","syncVersion","barcode","name","categoryId","purchasePriceCents","salePriceCents","stockQty","unit","lowStockThreshold","expiryDate","vatRateBp","lastSoldAt"],
    "categories":["id","name","color"],
    "sales":["id","createdAt","updatedAt","deletedAt","isDirty","syncVersion","ticketNumber","registerId","cashierId","subtotalCents","vatTotalCents","totalCents","discountCents","status","voidedAt","voidReason","soldAt"],
    "sale_items":["id","saleId","productId","productName","qty","unitPurchasePriceCents","unitSalePriceCents","vatRateBp","discountCents","lineTotalCents"],
    "payments":["id","saleId","method","amountCents","tenderedCents","changeCents"],
    "settings":["id","storeName","address","phone","logoPath","currency","defaultVatRateBp","ticketHeader","ticketFooter","registerId","nextTicketNumber","updatedAt"]
  };
  var fields=fieldMap[tableName];
  if(!fields){
    log("  (table inconnue: "+tableName+")","info");
    return;
  }
  var mapped=rows.map(function(r){return arrayToObj(r,fields);});
  switch(tableName){
    case"products":_old.products=mapped;break;
    case"categories":_old.categories=mapped;break;
    case"sales":_old.sales=mapped;break;
    case"sale_items":_old.saleItems=mapped;break;
    case"payments":_old.payments=mapped;break;
    case"settings":_old.settings=mapped.length>0?mapped[0]:null;break;
  }
}

function arrayToObj(arr,fields){
  if(!arr||!Array.isArray(arr))return arr;
  var obj={};
  for(var i=0;i<Math.min(arr.length,fields.length);i++)obj[fields[i]]=arr[i];
  return obj;
}

function readTable(data,pageSz,rootPage){
  var pageOff=(rootPage-1)*pageSz;
  if(pageOff>=data.length){log("  readTable: pageOff "+pageOff+" >= data.length "+data.length,"err");return[];}
  var pageType=data[pageOff];
  log("  readTable(rootPage="+rootPage+"): pageOff="+pageOff+" pageType="+pageType+" (0x"+pageType.toString(16)+")");
  if(pageType===13)return readLeafPage(data,pageOff,pageSz);
  if(pageType===5){
    var rows=[];
    var nCells=(data[pageOff+3]<<8)|data[pageOff+4];
    log("  Interior page: "+nCells+" cells");
    var ptrStart=pageOff+8;
    for(var i=0;i<nCells;i++){
      var childPage=(data[ptrStart+i*2]<<8)|data[ptrStart+i*2+1];
      log("    child["+i+"]: page "+childPage);
      if(childPage>0)rows=rows.concat(readTable(data,pageSz,childPage));
    }
    return rows;
  }
  log("  Page type "+pageType+" non géré","err");
  return[];
}

function readLeafPage(data,pageOff,pageSz){
  var rows=[];
  var nCells=(data[pageOff+3]<<8)|data[pageOff+4];
  var cellStart=(data[pageOff+5]<<8)|data[pageOff+6];
  if(cellStart===0||cellStart>pageSz)cellStart=pageSz;
  var off=pageOff+cellStart;

  for(var i=0;i<nCells;i++){
    if(off>=data.length)break;
    var pv=readVarint(data,off);var payloadLen=pv.v;off=pv.o;
    pv=readVarint(data,off);var rowid=pv.v;off=pv.o;
    var payload=data.slice(off,off+payloadLen);
    off+=payloadLen;

    var hs=readVarint(payload,0);
    var hdrBytes=hs.v;
    var hdrOff=hs.o;
    var serials=[];
    while(hdrOff<hdrBytes){
      var sv=readVarint(payload,hdrOff);
      serials.push(sv.v);
      hdrOff=sv.o;
    }

    var vals=[];
    var vOff=hdrBytes;
    for(var j=0;j<serials.length;j++){
      var s=serials[j];
      if(s===0){vals.push(null);}
      else if(s===1){vals.push(readI8(payload,vOff));vOff+=1;}
      else if(s===2){vals.push(readI16(payload,vOff));vOff+=2;}
      else if(s===3){vals.push(readI24(payload,vOff));vOff+=3;}
      else if(s===4){vals.push(readI32(payload,vOff));vOff+=4;}
      else if(s===5){vals.push(readI48(payload,vOff));vOff+=6;}
      else if(s===6){vals.push(readI64(payload,vOff));vOff+=8;}
      else if(s===7){vals.push(readF64(payload,vOff));vOff+=8;}
      else if(s===8){vals.push(0);}
      else if(s===9){vals.push(1);}
      else if(s>=12&&s%2===0){var bl=(s-12)/2;vals.push(readStr(payload,vOff,bl));vOff+=bl;}
      else if(s>=13&&s%2===1){var tl=(s-13)/2;vals.push(readStr(payload,vOff,tl));vOff+=tl;}
      else{vals.push(null);}
    }
    rows.push(vals);
  }
  return rows;
}

// Primitives
function readVarint(b,o){var v=0;for(var i=0;i<9;i++){var c=b[o+i];if(i<8){v=(v<<7)|(c&0x7f);if(c<0x80)return{v:v,o:o+i+1};}else{v=(v<<8)|c;return{v:v,o:o+i+1};}}return{v:v,o:o+9};}
function readI8(b,o){return b[o];}
function readI16(b,o){return(b[o]<<8)|b[o+1];}
function readI24(b,o){return(b[o]<<16)|(b[o+1]<<8)|b[o+2];}
function readI32(b,o){return(b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3];}
function readI48(b,o){return readI24(b,o)*65536+readI16(b,o+2);}
function readI64(b,o){return readI32(b,o)*4294967296+((readI32(b,o+4)>>>0));}
function readF64(b,o){var a=new Uint8Array(8);for(var i=0;i<8;i++)a[i]=b[o+i];return new DataView(a.buffer).getFloat64(0,false);}
function readStr(b,o,n){var s="";for(var i=0;i<n;i++)s+=String.fromCharCode(b[o+i]);return s;}

// ═══════════════════════════════════════════════════════════
//  DIRECT EXTRACTION (non-Drift data)
// ═══════════════════════════════════════════════════════════
function directExtract(allData){
  var storeNames=Object.keys(allData);
  storeNames.forEach(function(sname){
    var data=allData[sname]||[];
    if(data.length===0)return;
    var first=data[0];
    if(typeof first!=="object")return;
    var keys=Object.keys(first);
    var keyStr=keys.join(",").toLowerCase();
    if(keyStr.indexOf("barcode")>=0&&keyStr.indexOf("name")>=0){
      log("→ "+sname+": produits","ok");
      _old.products=data;
    } else if(keyStr.indexOf("ticketnumber")>=0&&(keyStr.indexOf("totalcents")>=0||keyStr.indexOf("total")>=0)){
      log("→ "+sname+": ventes","ok");
      _old.sales=data;
    } else if(keyStr.indexOf("saleid")>=0&&keyStr.indexOf("productname")>=0){
      log("→ "+sname+": articles de vente","ok");
      _old.saleItems=data;
    } else if(keyStr.indexOf("saleid")>=0&&keyStr.indexOf("method")>=0){
      log("→ "+sname+": paiements","ok");
      _old.payments=data;
    } else if(keyStr.indexOf("storename")>=0||keyStr.indexOf("ticketfooter")>=0){
      log("→ "+sname+": paramètres","ok");
      _old.settings=first;
    } else if(keyStr.indexOf("id")>=0&&keyStr.indexOf("name")>=0&&(sname.indexOf("cat")>=0)){
      log("→ "+sname+": catégories","ok");
      _old.categories=data;
    } else {
      log("→ "+sname+": inconnu ("+keys.slice(0,5).join(", ")+")","info");
    }
  });
  showExtractedAndMigrate();
}

// ═══════════════════════════════════════════════════════════
//  SHOW RESULTS AND MIGRATE
// ═══════════════════════════════════════════════════════════
function showExtractedAndMigrate(){
  document.getElementById("step3").classList.remove("hidden");
  var h='<table><tr><th>Table</th><th>Nb</th><th>Détails</th></tr>';
  function row(n,d){var c=d.length>0?(typeof d[0]==="object"?Object.keys(d[0]).length+" champs":"?"):0;return'<tr><td>'+n+'</td><td>'+d.length+'</td><td style="font-size:10px;color:#888;">'+c+'</td></tr>';}
  h+=row("📦 Produits",_old.products);
  h+=row("🏷️ Catégories",_old.categories);
  h+=row("💰 Ventes",_old.sales);
  h+=row("📋 Articles",_old.saleItems);
  h+=row("💳 Paiements",_old.payments);
  h+='<tr><td>⚙️ Paramètres</td><td>'+(_old.settings?"1":"0")+'</td><td></td></tr>';
  h+='</table>';

  if(_old.products.length>0){
    h+='<h3 style="font-size:14px;margin:10px 0 4px;">Produits (10 premiers):</h3>';
    h+='<table><tr><th>Nom</th><th>Barcode</th><th>Prix</th><th>Stock</th></tr>';
    _old.products.slice(0,10).forEach(function(p){
      h+='<tr><td>'+esc(p.name||"?")+'</td><td style="font-family:monospace;font-size:10px;">'+esc(p.barcode||"-")+'</td><td>'+(p.salePriceCents||0)+' cts</td><td>'+(p.stockQty!=null?p.stockQty:"?")+'</td></tr>';
    });
    h+='</table>';
  }

  if(_old.products.length===0&&_old.sales.length===0){
    h+='<div class="status status-err">❌ Aucune donnée extraite. Vérifiez le log ci-dessus.</div>';
  } else {
    h+='<button class="btn btn-success" onclick="runMigration()" style="margin-top:12px;">🚀 Migrer '+_old.products.length+' produits et '+_old.sales.length+' ventes</button>';
  }
  document.getElementById("s3-content").innerHTML=h;
}

// ═══════════════════════════════════════════════════════════
//  RUN MIGRATION
// ═══════════════════════════════════════════════════════════
function runMigration(){
  var btn=document.querySelector("#s3-content .btn-success");
  if(btn)btn.disabled=true;

  var catMap={};
  for(var i=0;i<_old.categories.length;i++){
    catMap[_old.categories[i].id]=_old.categories[i].name||"Divers";
  }

  function mapCat(name){
    if(!name)return"autre";
    var l=name.toLowerCase();
    if(l.indexOf("viande")>=0||l.indexOf("frais")>=0||l.indexOf("boucherie")>=0||l.indexOf("volaille")>=0)return"viande";
    if(l.indexOf("laitier")>=0||l.indexOf("froid")>=0)return"laitier";
    if(l.indexOf("epicerie")>=0||l.indexOf("sec")>=0)return"epicerie";
    if(l.indexOf("boulangerie")>=0)return"boulangerie";
    if(l.indexOf("boisson")>=0||l.indexOf("soda")>=0)return"boisson";
    if(l.indexOf("surgel")>=0||l.indexOf("congel")>=0)return"surgelé";
    if(l.indexOf("snack")>=0||l.indexOf("biscuit")>=0)return"snack";
    if(l.indexOf("condiment")>=0||l.indexOf("pice")>=0)return"condiment";
    if(l.indexOf("nager")>=0||l.indexOf("menager")>=0)return"menager";
    if(l.indexOf("vin")>=0||l.indexOf("alcool")>=0)return"vin";
    if(l.indexOf("volaille")>=0||l.indexOf("poulet")>=0||l.indexOf("canard")>=0||l.indexOf("dinde")>=0)return"volaille";
    return"autre";
  }

  var prodCount=0,salesCount=0,settingsOk=false;
  var promises=[];

  // Migrate products
  for(var pi=0;pi<_old.products.length;pi++){
    var p=_old.products[pi];
    var name=p.name||"";
    var barcode=p.barcode||"";
    if(!name&&!barcode)continue;
    var catName=catMap[p.categoryId]||p.categoryId||"";
    var salePrice=p.salePriceCents||0;
    var purPrice=p.purchasePriceCents||0;
    var stock=p.stockQty!=null?p.stockQty:0;
    promises.push(idbPut("acim-catalog","products",{
      barcode:barcode||("MIGR-"+Date.now()+"-"+pi),
      name:name,
      sale_price_cents:salePrice,
      purchase_price_cents:purPrice,
      category:mapCat(catName),
      stockQty:stock,
      lowStockThreshold:p.lowStockThreshold||5,
      expiryDate:p.expiryDate||null,
      unitType:p.unit||null,
      source:"flutter-migration",
      last_updated:Date.now()
    }));
    prodCount++;
  }

  Promise.all(promises).then(function(){
    promises=[];
    // Migrate sales
    for(var si=0;si<_old.sales.length;si++){
      var sale=_old.sales[si];
      if(sale.status==="voided"||sale.status==="cancelled")continue;
      var saleId=sale.id||"";
      var ts=sale.soldAt?new Date(sale.soldAt).getTime():(sale.createdAt?new Date(sale.createdAt).getTime():Date.now());
      var items=[];
      for(var ii=0;ii<_old.saleItems.length;ii++){
        var it=_old.saleItems[ii];
        if(it.saleId!==saleId)continue;
        items.push({name:it.productName||"",price:it.unitSalePriceCents||0,barcode:it.productId||"",cat:"autre",weight:null,unitType:null,pricePerUnit:null,discountCents:it.discountCents||0,qty:it.qty||1});
      }
      var payms=[];
      for(var ai=0;ai<_old.payments.length;ai++){
        var pa=_old.payments[ai];
        if(pa.saleId!==saleId)continue;
        payms.push({method:pa.method||"especes",amountCents:pa.amountCents||0,tenderedCents:pa.tenderedCents||pa.amountCents||0,changeCents:pa.changeCents||0});
      }
      promises.push(idbPut("acim-sales","sales",{ticketNumber:sale.ticketNumber||0,timestamp:ts,isoTime:new Date(ts).toISOString(),items:items,totalCents:sale.totalCents||0,discountCents:sale.discountCents||0,payments:payms,itemCount:items.length}));
      salesCount++;
    }
    return Promise.all(promises);
  }).then(function(){
    promises=[];
    if(_old.settings){
      promises.push(idbPut("acim-meta","meta",{key:"acim-store-settings",value:{storeName:_old.settings.storeName||"AcimCaisse",footer:_old.settings.ticketFooter||"Merci de votre visite !"}}));
      promises.push(idbPut("acim-meta","meta",{key:"acim-ticket-seq",value:{value:_old.settings.nextTicketNumber||1}}));
      settingsOk=true;
    }
    return Promise.all(promises);
  }).then(function(){
    document.getElementById("step3").innerHTML='<div class="status status-ok" style="font-size:16px;">✅ Migration terminée !</div>'+
      '<p style="margin:12px 0;">📦 <strong>'+prodCount+' produits</strong> migrés<br>💰 <strong>'+salesCount+' ventes</strong> migrées<br>⚙️ Paramètres: '+(settingsOk?"transférés":"non trouvés")+'</p>'+
      '<a href="index.html" class="btn btn-info" style="display:inline-block;text-decoration:none;">🏪 Ouvrir AcimCaisse</a>'+
      '<button class="btn btn-primary" onclick="location.reload()" style="margin-left:8px;">🔄 Revérifier</button>';
  }).catch(function(err){
    document.getElementById("step3").innerHTML='<div class="status status-err">❌ Erreur migration: '+err.message+'</div>';
  });
}

function idbPut(dbName,storeName,data){
  return new Promise(function(ok){
    try{
      var req=indexedDB.open(dbName,1);
      req.onupgradeneeded=function(e){
        var d=e.target.result;
        if(!d.objectStoreNames.contains(storeName)){
          if(storeName==="sales")d.createObjectStore(storeName,{keyPath:"id",autoIncrement:true});
          else if(storeName==="products")d.createObjectStore(storeName,{keyPath:"barcode"});
          else if(storeName==="meta")d.createObjectStore(storeName,{keyPath:"key"});
        }
      };
      req.onsuccess=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains(storeName)){ok();return;}
        var tx=db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).put(data);
        tx.oncomplete=function(){ok();};
        tx.onerror=function(){ok();};
      };
      req.onerror=function(){ok();};
    }catch(e){ok();}
  });
}
</script>
